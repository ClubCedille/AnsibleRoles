---
- name: Portchannel to distribution
  cisco.ios.ios_config:
    lines:
      - description PORTCHANNEL TO D1
      - switchport trunk allowed vlan {{ mgmt_vlan | string }},{{ access_vlan | string }},{{ extra_vlans | join(',') }}
      - switchport mode trunk
    parents:
      - interface Port-channel1

- name: Access Interfaces
  block:
    - name: Setting up VLAN
      loop: "{{ range(1, 48) | list }}"
      cisco.ios.ios_l2_interfaces:
        config:
          - name: GigabitEthernet1/0/{{ item }}
            spanning_tree:
              portfast:
                disabled: false
            mode: access
            access:
              vlan: "{{ access_vlan }}"
    - name: Setting up port security
      loop: "{{ range(1, 49) | list }}"
      cisco.ios.ios_config:
        lines:
          - switchport port-security maximum 2
          - switchport port-security violation restrict
          - switchport port-security aging time 5
          - switchport port-security aging type inactivity
          - switchport port-security
        parents:
          - interface GigabitEthernet1/0/{{ item }}

- name: Uplink Interfaces (4x1GB)
  when: uplink_config == '4x1'
  block:
    - name: Setting up VLAN
      loop: "{{ range(1, 5) | list }}"
      cisco.ios.ios_l2_interfaces:
        config:
          - name: GigabitEthernet1/1/{{ item }}
            mode: trunk
            trunk:
              allowed_vlans:
                - "{{ mgmt_vlan | string }}"
                - "{{ access_vlan | string }}"
                - "{{ extra_vlans }}"
    - name: Setting up channel-group
      loop: "{{ range(1, 5) | list }}"
      cisco.ios.ios_config:
        lines:
          - channel-group 1 mode active
        parents:
          - interface GigabitEthernet1/1/{{ item }}

- name: Uplink Interfaces (1x10GB)
  when: uplink_config == '1x10'
  cisco.ios.ios_l2_interfaces:
    config:
      - name: TenGigabitEthernet1/1/1
        mode: trunk
        trunk:
          allowed_vlans:
            - "{{ mgmt_vlan | string }}"
            - "{{ access_vlan | string }}"
            - "{{ extra_vlans }}"

- name: Uplink Interfaces (2x10GB)
  when: uplink_config == '2x10'
  block:
    - name: Setting up VLAN
      loop: "{{ range(1, 3) | list }}"
      cisco.ios.ios_l2_interfaces:
        config:
          - name: TenGigabitEthernet1/1/{{ item }}
            mode: trunk
            trunk:
              allowed_vlans: "{{ extra_vlans + [mgmt_vlan | string] + [access_vlan | string] }}"

    - name: Setting up channel-group
      loop: "{{ range(1, 3) | list }}"
      cisco.ios.ios_config:
        lines:
          - channel-group 1 mode active
        parents:
          - interface TenGigabitEthernet1/1/{{ item }}

- name: Final Access Interface
  block:
    - name: Setting up Final Interface
      cisco.ios.ios_l2_interfaces:
        config:
          - name: GigabitEthernet1/0/48
            spanning_tree:
              portfast:
                disabled: false
            mode: access
            access:
              vlan: "{{ access_vlan }}"
