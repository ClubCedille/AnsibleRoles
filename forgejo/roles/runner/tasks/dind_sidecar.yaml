---
# Sidecar Docker-in-Docker réel pour les jobs de build d'images — voir le
# commentaire de forgejo_runner_dind_sidecar_enabled dans defaults/main.yaml.

- name: Create dedicated Docker network for the DinD sidecar
  community.docker.docker_network:
    name: "{{ forgejo_runner_dind_network }}"
    state: present

- name: Deploy the DinD sidecar container
  community.docker.docker_container:
    name: "{{ forgejo_runner_dind_sidecar_name }}"
    image: "{{ forgejo_runner_dind_sidecar_image }}"
    privileged: true
    env:
      # L'image officielle docker:dind écoute en TLS sur :2376 par défaut
      # (DOCKER_TLS_CERTDIR=/certs). On désactive le TLS (DOCKER_TLS_CERTDIR
      # vide) pour qu'elle écoute en clair sur :2375, l'adresse déjà
      # utilisée par forgejo_runner_dind_sidecar_name ci-dessus — acceptable
      # ici : pas de port publié vers l'hôte, le sidecar n'est joignable que
      # par les conteneurs de job attachés au même réseau Docker dédié.
      DOCKER_TLS_CERTDIR: ""
    networks:
      - name: "{{ forgejo_runner_dind_network }}"
    networks_cli_compatible: true
    restart_policy: always
    state: started
    comparisons:
      "*": strict
