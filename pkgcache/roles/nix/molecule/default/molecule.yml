---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/default/requirements.yml
driver:
  name: docker
platforms:
  # Le rôle suppose Nix déjà installé et ne gère qu'écriture de fichiers +
  # notify d'un handler systemd. manage_daemon_service:false en converge
  # évite d'avoir besoin d'un vrai nix-daemon/systemd (cf. limitation PR).
  - name: pkgcache-nix-ubuntu2404
    image: ubuntu:24.04
    pre_build_image: true
provisioner:
  name: ansible
  options:
    diff: true
  playbooks:
    converge: converge.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
