---
- name: Converge
  hosts: all
  vars:
    # Dict complet (pas un override partiel) : Ansible ne fusionne pas les
    # dicts de vars par défaut (hash_behaviour=replace, non configuré ici).
    pkgcache_apt:
      enabled: true
      # Le vrai mirroir public Ubuntu tient lieu de "cache" ici : les
      # identifiants fictifs sont envoyés en Basic Auth mais ignorés par un
      # serveur qui n'en fait pas — ça permet un test bout-en-bout réel
      # (apt-get update réussit vraiment) sans dépendre du cache interne
      # Cedille, injoignable depuis un conteneur de test isolé.
      cache_host: archive.ubuntu.com
      credentials:
        username: molecule
        password: molecule
      sources_dir: /etc/apt/sources.list.d
      file_mode: "0600"
      manage_default_sources: true
      default_sources_files:
        - /etc/apt/sources.list.d/ubuntu.sources
        - /etc/apt/sources.list.d/debian.sources
        - /etc/apt/sources.list
      mirrors:
        - name: ubuntu-archive
          origin: ubuntu
          suites: >-
            {{ ansible_distribution_release }}
            {{ ansible_distribution_release }}-updates
            {{ ansible_distribution_release }}-backports
          components: main restricted universe multiverse
          signed_by: /usr/share/keyrings/ubuntu-archive-keyring.gpg
      update_cache_on_change: true
  # Image officielle minimale sans sudo ; le rôle a "become: true" en dur
  # sur ses tâches, donc on l'installe avant plutôt que de le contourner.
  pre_tasks:
    - name: Install sudo (missing from the minimal ubuntu:24.04 image)
      ansible.builtin.apt:
        name: sudo
        update_cache: true
  roles:
    - role: cedille.pkgcache.apt
