---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/default/requirements.yml
driver:
  name: docker
platforms:
  # Rôle purement fichiers/commandes, pas de démon : image officielle
  # simple suffit, pas besoin de systemd/privileged/cgroupns (cf. rôles
  # docker.install/forgejo.runner/monitoring.*).
  - name: pkgcache-apt-ubuntu2404
    image: ubuntu:24.04
    pre_build_image: true
provisioner:
  name: ansible
  options:
    diff: true
  playbooks:
    converge: converge.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
