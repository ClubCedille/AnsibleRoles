---
- name: Assert pkgcache opnsense credentials are provided
  ansible.builtin.assert:
    that:
      - pkgcache_opnsense.credentials.username | length > 0
      - pkgcache_opnsense.credentials.password | length > 0
    fail_msg: >-
      pkgcache_opnsense.credentials.username/password sont vides.
      Fournissez-les via un vault (host_vars/group_vars) — voir
      docs/README.md.
    quiet: true

- name: Write pkgcache FreeBSD base repo conf on OPNsense
  ansible.builtin.template:
    src: FreeBSD.conf.j2
    dest: "{{ pkgcache_opnsense.repos_dir }}/FreeBSD.conf"
    owner: root
    group: wheel
    mode: "{{ pkgcache_opnsense.file_mode }}"
    backup: true
  no_log: true
  become: true
  notify: Update pkg cache
