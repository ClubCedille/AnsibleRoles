---
dependency:
  name: galaxy
driver:
  name: delegated
platforms:
  - name: vyos-test
    groups:
      - vyos
provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      vyos:
        ansible_connection: network_cli
        ansible_network_os: vyos.vyos.vyos
        ansible_user: vyos
        ansible_password: vyos
        ansible_become: true
        ansible_become_method: enable
verifier:
  name: ansible
