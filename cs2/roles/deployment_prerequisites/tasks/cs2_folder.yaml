---

- name: Vérifier la présence du binaire steamcmd
  ansible.builtin.stat:
    path: /usr/games/steamcmd
  register: steamcmd_bin
  become: true

# L'installation (apt, dans steamcmd_install.yaml) supporte pleinement le
# check mode et est simulée sous --check : sur un hôte jamais provisionné
# pour de vrai, le binaire n'existe donc pas encore, et cet échec se
# produirait systématiquement en dry-run même quand tout serait correct
# en application réelle.
- name: Échouer si steamcmd n'est pas installé
  ansible.builtin.fail:
    msg: "steamcmd est introuvable à /usr/games/steamcmd. Vérifie la tâche d'installation."
  when: not steamcmd_bin.stat.exists and not ansible_check_mode

- name: Vérifier steamcmd (run minimal)
  ansible.builtin.command: /usr/games/steamcmd +quit
  environment:
    HOME: /home/steam
  become: true
  become_user: steam
  register: steamcmd_check
  changed_when: false
  failed_when: steamcmd_check.rc != 0
  retries: 2
  delay: 5
  until: steamcmd_check.rc == 0

- name: Créer dossier cs2_server
  ansible.builtin.file:
    path: /home/steam/cs2_server
    state: directory
    owner: steam
    group: steam
    mode: "0750"
  become: true
  become_user: steam
