---
- name: Download Metamod
  ansible.builtin.get_url:
    url: "{{ cs2_metamod_url }}"
    dest: /home/steam/cs2_server/game/csgo/mmsource.tar.gz
  become: true

- name: Extract Metamod
  ansible.builtin.unarchive:
    src: /home/steam/cs2_server/game/csgo/mmsource.tar.gz
    dest: /home/steam/cs2_server/game/csgo/
    remote_src: true
  become: true

- name: Remove Metamod archive
  ansible.builtin.file:
    path: /home/steam/cs2_server/game/csgo/mmsource.tar.gz
    state: absent
  become: true

- name: Download CSSSharp
  ansible.builtin.get_url:
    url: "{{ cs2_csssharp_url }}"
    dest: /home/steam/cs2_server/game/csgo/counterstrikesharp.zip
  become: true

- name: Extract CSSSharp
  ansible.builtin.unarchive:
    src: /home/steam/cs2_server/game/csgo/counterstrikesharp.zip
    dest: /home/steam/cs2_server/game/csgo/
    remote_src: true
  become: true

- name: Remove CSSSharp archive
  ansible.builtin.file:
    path: /home/steam/cs2_server/game/csgo/counterstrikesharp.zip
    state: absent
  become: true

- name: Download MatchZy
  ansible.builtin.get_url:
    url: "{{ cs2_matchzy_url }}"
    dest: /home/steam/cs2_server/game/csgo/MatchZy.zip
  become: true

- name: Extract MatchZy
  ansible.builtin.unarchive:
    src: /home/steam/cs2_server/game/csgo/MatchZy.zip
    dest: /home/steam/cs2_server/game/csgo/
    remote_src: true
  become: true

- name: Remove MatchZy archive
  ansible.builtin.file:
    path: /home/steam/cs2_server/game/csgo/MatchZy.zip
    state: absent
  become: true

- name: Backup gameinfo.gi file
  ansible.builtin.copy:
    src: /home/steam/cs2_server/game/csgo/gameinfo.gi
    dest: /home/steam/cs2_server/game/csgo/gameinfo.gi.bak
    remote_src: True
  become: true

- name: Update gameinfo.gi to add Metamod
  ansible.builtin.lineinfile:
    path: /home/steam/cs2_server/game/csgo/gameinfo.gi
    insertafter: 'Game_LowViolence\s*csgo_lv\s*\/\/\s*Perfect\s*World\s*content\s*override'
    line: '        Game csgo\\addons\\metamod'
  become: true

- name: Ensure cfg directory exists
  ansible.builtin.file:
    path: /home/steam/cs2_server/game/csgo/cfg
    state: directory
    owner: steam
    group: steam
    mode: '0755'
  become: true

- name: Verify and correct about the sv_logecho
  ansible.builtin.lineinfile:
    path: /home/steam/cs2_server/game/csgo/cfg/server.cfg
    line: "sv_logecho 1"
    regexp: "^sv_logecho"
    create: yes
    owner: steam
    group: steam
    mode: '0644'
  become: true

- name: Verify and correct about the log on
  ansible.builtin.lineinfile:
    path: /home/steam/cs2_server/game/csgo/cfg/server.cfg
    line: "log on"
    regexp: "^log"
    create: yes
    owner: steam
    group: steam
    mode: '0644'
  become: true


# --- Robustifications supplémentaires ---
- name: Ensure addons directory exists
  ansible.builtin.file:
    path: "{{ cs2_addons_dir | default('/home/steam/cs2_server/game/csgo/addons') }}"
    state: directory
    owner: steam
    group: steam
    mode: '0755'
  become: true

- name: Move extracted plugin folders into addons if they exist at top-level
  ansible.builtin.shell: |
    set -e
    for p in "metamod" "sourcemod" "counterstrikesharp" "MatchZy"; do
      if [ -d "{{ cs2_game_dir | default('/home/steam/cs2_server/game/csgo') }}/$p" ]; then
        mv -f "{{ cs2_game_dir | default('/home/steam/cs2_server/game/csgo') }}/$p" "{{ cs2_addons_dir | default('/home/steam/cs2_server/game/csgo/addons') }}/" || true
      fi
    done
  args:
    executable: /bin/bash
  become: true

- name: Ensure ownership and perms for addons and cfg
  ansible.builtin.command:
    cmd: chown -R steam:steam "{{ cs2_addons_dir | default('/home/steam/cs2_server/game/csgo/addons') }}" && chmod -R u+rwX,go+rX "{{ cs2_addons_dir | default('/home/steam/cs2_server/game/csgo/addons') }}"
  become: true

- name: Ensure Metamod reference in gameinfo.gi
  ansible.builtin.blockinfile:
    path: "{{ cs2_game_dir | default('/home/steam/cs2_server/game/csgo') }}/gameinfo.gi"
    block: |
      	Game csgo\\addons\\metamod
    marker: "# {mark} ANSIBLE METAMOD"
    create: yes
  become: true

- name: Verify presence of critical plugin directories
  ansible.builtin.stat:
    path: "{{ item }}"
  register: plugin_stats
  loop:
    - "{{ cs2_addons_dir | default('/home/steam/cs2_server/game/csgo/addons') }}/metamod"
    - "{{ cs2_addons_dir | default('/home/steam/cs2_server/game/csgo/addons') }}/counterstrikesharp"
    - "{{ cs2_addons_dir | default('/home/steam/cs2_server/game/csgo/addons') }}/MatchZy"
  become: true

- name: Fail if critical plugin missing
  ansible.builtin.fail:
    msg: "Plugin manquant: {{ item.item }} — vérifie les URLs et l'extraction."
  when: not item.stat.exists
  loop: "{{ plugin_stats.results }}"
  become: true

- name: Debug list of addons (présent sur la machine cible)
  ansible.builtin.command:
    cmd: ls -la "{{ cs2_addons_dir | default('/home/steam/cs2_server/game/csgo/addons') }}"
  register: addons_list
  changed_when: false
  become: true

- name: Afficher la liste des addons détectés
  ansible.builtin.debug:
    var: addons_list.stdout_lines
