---
name: Molecule - proxmox.pwdssh

on:
  pull_request:
    paths:
      - "proxmox/roles/pwdssh/**"
      - ".github/workflows/molecule-proxmox-pwdssh.yaml"
  push:
    branches:
      - main
    paths:
      - "proxmox/roles/pwdssh/**"
      - ".github/workflows/molecule-proxmox-pwdssh.yaml"

concurrency:
  group: molecule-proxmox-pwdssh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  molecule:
    name: Molecule test (proxmox.pwdssh)
    runs-on: [self-hosted, docker-dind]
    defaults:
      run:
        working-directory: proxmox/roles/pwdssh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Molecule and dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install \
            "ansible-core>=2.16.3" \
            molecule \
            "molecule-plugins[docker]" \
            docker \
            ansible-lint

      # Runner persistant partagé avec d'autres rôles cedille.proxmox : un résidu
      # d'un run précédent fait échouer ansible-galaxy (cf. AnsibleRoles#95).
      - name: Clean up any leftover cedille.proxmox collection install
        run: rm -rf ~/.ansible/collections/ansible_collections/cedille/proxmox

      - name: Install required Ansible collections
        run: |
          ansible-galaxy collection install -r molecule/default/requirements.yml

      - name: Molecule check (dry-run regression)
        run: molecule check
        env:
          PY_COLOR: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Molecule test
        run: molecule test
        env:
          PY_COLOR: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Clean up Molecule containers and images
        if: always()
        run: |
          molecule destroy || true
          docker rm -f pwdssh-ubuntu2404 2>/dev/null || true
