---
name: Molecule - docker.install

on:
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/molecule-docker.yaml"
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/molecule-docker.yaml"

concurrency:
  group: molecule-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  molecule:
    name: Molecule test (docker.install)
    runs-on: [self-hosted, docker-dind]
    defaults:
      run:
        working-directory: docker/roles/install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Molecule and dependencies
        run: |
          python3 -m pip install --upgrade pip
          # Pas de plafond de version : community.docker/community.general
          # avancent plus vite que ansible-core et refusent de s'installer
          # sur une version trop ancienne ("Collection community.docker does
          # not support Ansible version X"). Même pin que AnsibleInfra
          # (requirements.txt), qui tourne avec ces mêmes collections.
          pip install \
            "ansible-core>=2.16.3" \
            molecule \
            "molecule-plugins[docker]" \
            docker \
            ansible-lint

      - name: Install required Ansible collections
        run: |
          ansible-galaxy collection install -r molecule/default/requirements.yml

      # Molecule (via ansible-compat) installe lui-même la collection locale
      # cedille.docker sous ~/.ansible/collections/... au démarrage de chaque
      # sous-commande ("prerun" -> ansible-galaxy collection install --force
      # ../.."), donc converge.yml peut référencer cedille.docker.install
      # sans setup manuel. Ce runner self-hosted est persistant (pas
      # éphémère) : on purge l'éventuel résidu d'un run précédent avant de
      # laisser Molecule réinstaller proprement — un `--force` de
      # ansible-galaxy plante sinon avec "Cannot call rmtree on a symbolic
      # link" si le chemin cible est un vieux lien symbolique (ou tout autre
      # état inattendu) laissé par une exécution antérieure.
      - name: Clean up any leftover cedille.docker collection install
        run: rm -rf ~/.ansible/collections/ansible_collections/cedille/docker

      - name: Molecule check (dry-run regression, PR #92)
        run: molecule check
        env:
          PY_COLOR: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Molecule test
        run: molecule test
        env:
          PY_COLOR: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Clean up Molecule containers and images
        if: always()
        run: |
          molecule destroy || true
          docker rm -f docker-install-ubuntu2204 2>/dev/null || true
