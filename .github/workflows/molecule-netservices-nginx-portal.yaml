---
name: Molecule - netservices.nginx_portal

on:
  pull_request:
    paths:
      - "netservices/roles/nginx_portal/**"
      - ".github/workflows/molecule-netservices-nginx-portal.yaml"
  push:
    branches:
      - main
    paths:
      - "netservices/roles/nginx_portal/**"
      - ".github/workflows/molecule-netservices-nginx-portal.yaml"

concurrency:
  group: molecule-netservices-nginx-portal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  molecule:
    name: Molecule test (netservices.nginx_portal)
    runs-on: [self-hosted, docker-dind]
    defaults:
      run:
        working-directory: netservices/roles/nginx_portal
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Molecule and dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install \
            "ansible-core>=2.16.3" \
            molecule \
            "molecule-plugins[docker]" \
            docker \
            ansible-lint

      # Runner persistant : un résidu d'un run précédent fait échouer
      # ansible-galaxy avec "Cannot call rmtree on a symbolic link" (cf. AnsibleRoles#95).
      - name: Clean up any leftover cedille.netservices collection install
        run: rm -rf ~/.ansible/collections/ansible_collections/cedille/netservices

      - name: Install required Ansible collections
        run: |
          ansible-galaxy collection install -r molecule/default/requirements.yml

      - name: Molecule check (dry-run regression)
        run: molecule check
        env:
          PY_COLOR: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Molecule test
        run: molecule test
        env:
          PY_COLOR: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Clean up Molecule containers and images
        if: always()
        run: |
          molecule destroy || true
          docker rm -f nginx-portal-ubuntu2404 2>/dev/null || true
