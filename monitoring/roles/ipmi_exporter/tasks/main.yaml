---
- name: Install FreeIPMI tools (required by ipmi_exporter)
  ansible.builtin.apt:
    name:
      - freeipmi-tools
    state: present
    update_cache: true

- name: Create ipmi_exporter system group
  ansible.builtin.group:
    name: "{{ ipmi_exporter_service.group }}"
    system: true

- name: Create ipmi_exporter system user
  ansible.builtin.user:
    name: "{{ ipmi_exporter_service.user }}"
    group: "{{ ipmi_exporter_service.group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ ipmi_exporter_paths.install_dir }}"
    create_home: false

# ipmi_exporter needs to run FreeIPMI tools that require root or sudo
# Grant passwordless sudo for freeipmi binaries only
- name: Grant ipmi_exporter sudo for FreeIPMI tools
  ansible.builtin.copy:
    content: |
      ipmi_exporter ALL=(root) NOPASSWD: /usr/sbin/ipmimonitoring, /usr/sbin/ipmi-sensors, /usr/sbin/ipmi-dcmi, /usr/sbin/ipmi-raw, /usr/sbin/bmc-info, /usr/sbin/ipmi-chassis, /usr/sbin/ipmi-sel
    dest: /etc/sudoers.d/ipmi_exporter
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Download ipmi_exporter archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus-community/ipmi_exporter/releases/download/v{{ ipmi_exporter_version }}/ipmi_exporter-{{ ipmi_exporter_version }}.linux-amd64.tar.gz"
    dest: "{{ ipmi_exporter_paths.archive_download_dir }}/ipmi_exporter-{{ ipmi_exporter_version }}.tar.gz"
    mode: "0644"

- name: Extract ipmi_exporter binary
  ansible.builtin.unarchive:
    src: "{{ ipmi_exporter_paths.archive_download_dir }}/ipmi_exporter-{{ ipmi_exporter_version }}.tar.gz"
    dest: "{{ ipmi_exporter_paths.archive_download_dir }}"
    remote_src: true
    creates: "{{ ipmi_exporter_paths.archive_download_dir }}/ipmi_exporter-{{ ipmi_exporter_version }}.linux-amd64/ipmi_exporter"

- name: Install ipmi_exporter binary
  ansible.builtin.copy:
    src: "{{ ipmi_exporter_paths.archive_download_dir }}/ipmi_exporter-{{ ipmi_exporter_version }}.linux-amd64/ipmi_exporter"
    dest: "{{ ipmi_exporter_paths.binary }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart ipmi_exporter

- name: Create ipmi_exporter config directory
  ansible.builtin.file:
    path: "{{ ipmi_exporter_paths.config_dir }}"
    state: directory
    owner: "{{ ipmi_exporter_service.user }}"
    group: "{{ ipmi_exporter_service.group }}"
    mode: "0750"

- name: Write ipmi_exporter configuration
  ansible.builtin.template:
    src: ipmi_config.yml.j2
    dest: "{{ ipmi_exporter_paths.config }}"
    owner: "{{ ipmi_exporter_service.user }}"
    group: "{{ ipmi_exporter_service.group }}"
    mode: "0640"
  notify: Restart ipmi_exporter

- name: Write ipmi_exporter systemd unit
  ansible.builtin.template:
    src: ipmi_exporter.service.j2
    dest: "{{ ipmi_exporter_paths.service_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart ipmi_exporter

- name: Enable and start ipmi_exporter
  ansible.builtin.systemd:
    name: "{{ ipmi_exporter_service.name }}"
    state: started
    enabled: true
    daemon_reload: true
