---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check that the node_exporter service is running
      ansible.builtin.service_facts:

    - name: Assert node_exporter service is active and enabled
      ansible.builtin.assert:
        that:
          - "'node_exporter.service' in ansible_facts.services"
          - ansible_facts.services['node_exporter.service'].state == 'running'
          - ansible_facts.services['node_exporter.service'].status == 'enabled'
        fail_msg: "Le service node_exporter n'est pas démarré/activé."

    - name: Stat the node_exporter binary
      ansible.builtin.stat:
        path: /usr/local/bin/node_exporter
      register: molecule_verify_binary

    - name: Assert the node_exporter binary is installed and executable
      ansible.builtin.assert:
        that:
          - molecule_verify_binary.stat.exists
          - molecule_verify_binary.stat.executable
        fail_msg: "Le binaire node_exporter n'est pas installé ou pas exécutable."

    - name: Query the node_exporter metrics endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:9100/metrics"
        return_content: true
      register: molecule_verify_metrics

    - name: Assert the metrics endpoint serves real Prometheus metrics
      ansible.builtin.assert:
        that:
          - molecule_verify_metrics.status == 200
          - "'node_exporter_build_info' in molecule_verify_metrics.content"
        fail_msg: "L'endpoint /metrics de node_exporter ne répond pas comme attendu."
