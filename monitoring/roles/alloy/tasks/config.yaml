---
# Alloy's packaged systemd unit runs as the unprivileged "alloy" user (see
# the CAP_NET_BIND_SERVICE override below) -- password files are
# root:alloy 0640 rather than embedding credentials directly in
# config.alloy (mode 0644, world-readable).
- name: Create Alloy secrets directory
  ansible.builtin.file:
    path: "{{ alloy_paths.secrets_dir }}"
    state: directory
    owner: root
    group: alloy
    mode: "0750"
  become: true
  when: alloy_loki_endpoints | selectattr('basic_auth', 'defined') | list | length > 0

- name: Write Loki endpoint BasicAuth password files
  ansible.builtin.copy:
    content: "{{ endpoint.basic_auth.password }}"
    dest: "{{ alloy_paths.secrets_dir }}/{{ endpoint.name }}-password"
    owner: root
    group: alloy
    mode: "0640"
  become: true
  no_log: true
  loop: "{{ alloy_loki_endpoints | selectattr('basic_auth', 'defined') | list }}"
  loop_control:
    loop_var: endpoint
  notify:
    - Restart Alloy

- name: Write Alloy configuration
  ansible.builtin.template:
    src: "{{ alloy_paths.config_template }}"
    dest: "{{ alloy_paths.config }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart Alloy
  become: true

- name: Configure Alloy CLI args (/etc/default/alloy)
  ansible.builtin.template:
    src: alloy-default.j2
    dest: /etc/default/alloy
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart Alloy
  become: true
  when: alloy_custom_args | length > 0

# loki.source.syslog listeners on privileged ports (e.g. UDP 514) need this;
# Alloy's packaged systemd unit runs as the unprivileged "alloy" user.
- name: Create Alloy systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: alloy_syslog_sources | length > 0

- name: Grant Alloy CAP_NET_BIND_SERVICE for syslog listeners
  ansible.builtin.template:
    src: alloy-override.conf.j2
    dest: /etc/systemd/system/alloy.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Alloy
  become: true
  when: alloy_syslog_sources | length > 0

- name: Ensure Alloy service state
  ansible.builtin.service:
    name: "{{ alloy_service.name }}"
    state: "{{ alloy_service.state }}"
    enabled: "{{ alloy_service.enabled }}"
  become: true
