---
# Requires connection: local at the play level (API calls issued from the
# control node — see role README and cedille.opnsense.config for precedent).

- name: Configure remote syslog destination (monitoring01 / Alloy)
  oxlorg.opnsense.syslog:
    firewall: "{{ vm_net.ip }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: false
    match_fields: ["description"]
    target: "{{ opnsense_syslog_target }}"
    port: "{{ opnsense_syslog_port }}"
    transport: "{{ opnsense_syslog_transport }}"
    facility: "{{ opnsense_syslog_facility if opnsense_syslog_facility | length > 0 else omit }}"
    level: "{{ opnsense_syslog_level if opnsense_syslog_level | length > 0 else omit }}"
    rfc5424: "{{ opnsense_syslog_rfc5424 }}"
    description: "{{ opnsense_syslog_description }}"
    state: present
  register: _opnsense_syslog_destination

# The "set" call above only persists to config.xml — it does NOT regenerate
# /usr/local/etc/syslog-ng.conf.d/syslog-ng-destinations.conf nor reload the
# running syslog-ng daemon (confirmed empirically: the generated file stayed
# empty and no packets left the box after "set" alone, on OPNsense 26.7.3_8).
# There is no dedicated "reconfigure" action on this controller — "reset" is
# the actual apply action (OPNsense\Syslog\Api\ServiceController::resetAction,
# runs configd job "syslog reset").
- name: Apply syslog configuration (regenerate destinations + reload daemon)
  ansible.builtin.uri:
    url: "https://{{ vm_net.ip }}/api/syslog/service/reset"
    method: POST
    user: "{{ opnsense_api_key }}"
    password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
  register: _opnsense_syslog_reset
  failed_when: _opnsense_syslog_reset.json.status | default('') != 'ok'
  when: _opnsense_syslog_destination.changed | default(true)
