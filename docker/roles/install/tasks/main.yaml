---
- name: Include Ubuntu install tasks
  ansible.builtin.include_tasks: ubuntu.yaml
  when: ansible_distribution == "Ubuntu"

- name: Include Alpine install tasks
  ansible.builtin.include_tasks: alpine.yaml
  when: ansible_distribution == "Alpine"

- name: Fail when distribution is unsupported
  ansible.builtin.fail:
    msg: >-
      Unsupported distribution '{{ ansible_distribution }}' for role docker.install.
      Supported distributions: Ubuntu, Alpine.
  when: ansible_distribution not in ["Ubuntu", "Alpine"]

- name: Manage docker compose file
  ansible.builtin.include_tasks: setup_compose.yaml

- name: Configure registry mirror
  ansible.builtin.include_tasks: configure_mirror.yaml
  when: docker_registry_mirror_enabled | bool

- name: Docker compose up the path
  community.docker.docker_compose_v2:
    project_src: "{{ install_docker_compose_target_dir }}"
    state: present
