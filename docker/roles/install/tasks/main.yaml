---
- name: Include Ubuntu install tasks
  ansible.builtin.include_tasks: ubuntu.yaml
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Include Alpine install tasks
  ansible.builtin.include_tasks: alpine.yaml
  when: ansible_facts['distribution'] == "Alpine"

- name: Fail when distribution is unsupported
  ansible.builtin.fail:
    msg: >-
      Unsupported distribution '{{ ansible_facts["distribution"] }}' for role docker.install.
      Supported distributions: Ubuntu, Alpine.
  when: ansible_facts['distribution'] not in ["Ubuntu", "Alpine"]

- name: Manage docker compose file
  ansible.builtin.include_tasks: setup_compose.yaml

- name: Configure registry mirror
  ansible.builtin.include_tasks: configure_mirror.yaml
  # "docker_registry_mirror_enabled" (sans préfixe) accepté pour
  # rétrocompatibilité : les defaults du rôle définissent
  # install_docker_registry_mirror_enabled (préfixé, cohérent avec le reste
  # du rôle), mais tous les consommateurs actuels dans AnsibleInfra
  # définissent le nom sans préfixe — sans ce fallback, install_docker_*
  # ne sert jamais et un nouveau consommateur qui ne définirait ni l'un ni
  # l'autre plante sur une variable non définie.
  when: (docker_registry_mirror_enabled | default(install_docker_registry_mirror_enabled)) | bool

- name: Docker compose up the path
  community.docker.docker_compose_v2:
    project_src: "{{ install_docker_compose_target_dir }}"
    state: present
