---
- name: Converge
  hosts: all
  become: true
  vars:
    install_docker_compose_source_type: inline
    install_docker_compose_content: |
      services:
        sleep:
          image: busybox:latest
          command: sleep 3600
    # Contournement temporaire : tasks/main.yaml:22 lit "docker_registry_mirror_enabled"
    # (sans préfixe install_) au lieu de "install_docker_registry_mirror_enabled" défini
    # dans defaults/main.yaml. Bug déjà tracké séparément, ne pas corriger ici.
    docker_registry_mirror_enabled: false
    install_docker_registry_mirror_enabled: false
    # tasks/ubuntu.yaml "Add specified user(s) to the docker group" lit
    # ansible_user (le user de connexion SSH en usage réel) — non défini ici
    # car Molecule se connecte via le driver docker, pas SSH.
    ansible_user: root
  # Le conteneur de test tourne lui-même sur un système de fichiers overlay
  # (celui du Docker de l'hôte/runner) : le containerd installé par le rôle
  # ne peut pas empiler un second overlayfs par-dessus (confirmé en CI :
  # "failed to mount ... overlay ... invalid argument" au premier
  # "docker compose up"). Force le storage-driver vfs — plus lent, mais
  # fonctionne indépendamment du driver de stockage de l'hôte qui exécute
  # les conteneurs Molecule.
  pre_tasks:
    - name: Ensure /etc/docker exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Force the vfs storage driver (nested overlay is unsupported here)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "storage-driver": "vfs"
          }
        mode: "0644"
  roles:
    - role: cedille.docker.install
