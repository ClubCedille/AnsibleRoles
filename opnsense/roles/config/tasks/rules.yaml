---
# Firewall rules — new format (Firewall → Automation → Filter in OPNsense UI).
# These rules are managed via /api/firewall/filter/ and processed BEFORE the
# classic per-interface rules.
#
# Migration context: the 17 classic rules currently in <filter> of config.xml
# are replicated here in the new format. Once Ansible has applied these rules
# and the diff playbook confirms a match, the classic rules should be removed
# via Firewall → Rules → Migration assistant in the OPNsense GUI.
#
# Idempotency: match_fields=["description"] — descriptions must be unique.
# Sequence numbers control processing order within each group.

# ---------------------------------------------------------------------------
# Precompute derived values used in rules below
# ---------------------------------------------------------------------------

- name: Precompute rule variables
  ansible.builtin.set_fact:
    _opnsense_lan_cidr: >-
      {{ (vm_net_trunk.vlans | selectattr('interface_name', 'equalto', 'lan') | list | first).network }}/{{
         (vm_net_trunk.vlans | selectattr('interface_name', 'equalto', 'lan') | list | first).mask }}
    _opnsense_api_common: &api_common
      firewall: "{{ vm_net.ip }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret }}"
      match_fields:
        - description

# ---------------------------------------------------------------------------
# WAN rules (sequence 10–50)
# ---------------------------------------------------------------------------

- name: "WAN | Allow WireGuard inbound (UDP 51820)"
  oxlorg.opnsense.rule:
    firewall: "{{ vm_net.ip }}"
    api_key: "{{ api_key }}"
    api_secret: "{{ api_secret }}"
    match_fields: ["description"]
    sequence: 10
    interface: ["wan"]
    action: pass
    direction: in
    ip_protocol: inet
    protocol: UDP
    source_net: any
    destination_net: "{{ vm_net.vip }}"
    destination_port: "51820"
    description: "WAN | Allow WireGuard inbound (UDP 51820)"
    enabled: true

