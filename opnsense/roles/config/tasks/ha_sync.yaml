---
# HA synchronisation — pfsync state sync + XMLRPC config sync.
#
# Current production setup: pfsync only (syncitems empty).
# XMLRPC sync is configured via opnsense_ha_syncitems (default: []).
# See defaults/main.yaml.

- name: "HA | Allow sync traffic from peer (pfsync + XMLRPC)"
  oxlorg.opnsense.rule:
    firewall: "{{ vm_net.ip }}"
    api_key: "{{ api_key }}"
    api_secret: "{{ api_secret }}"
    match_fields: ["description"]
    sequence: 600
    interface: ["{{ opnsense_ha_interface }}"]
    action: pass
    direction: in
    ip_protocol: inet
    protocol: any
    source_net: "{{ opnsense_ha_peer_net }}"
    destination_net: "{{ opnsense_ha_device_ip }}"
    description: "HA | Allow sync traffic from peer (pfsync + XMLRPC)"
    enabled: true

- name: "HA | Configure pfsync and XMLRPC settings"
  oxlorg.opnsense.hasync_general:
    firewall: "{{ vm_net.ip }}"
    api_key: "{{ api_key }}"
    api_secret: "{{ api_secret }}"
    preempt: true
    disconnect_ppps: false
    pfsync_interface: "{{ opnsense_ha_interface }}"
    pfsync_peer_ip: "{{ opnsense_ha_peer_ip }}"
    username: "{{ vm_user }}"
    password: "{{ vm_password }}"

- name: "HA | Push XMLRPC sync from master to backup"
  oxlorg.opnsense.hasync_general:
    firewall: "{{ vm_net.ip }}"
    api_key: "{{ api_key }}"
    api_secret: "{{ api_secret }}"
    preempt: true
    disconnect_ppps: false
    pfsync_interface: "{{ opnsense_ha_interface }}"
    pfsync_peer_ip: "{{ opnsense_ha_peer_ip }}"
    synchronize_to_ip: "{{ opnsense_ha_peer_ip }}"
    username: "{{ vm_user }}"
    password: "{{ vm_password }}"
    syncitems: "{{ opnsense_ha_syncitems }}"
  when: vm_is_master
