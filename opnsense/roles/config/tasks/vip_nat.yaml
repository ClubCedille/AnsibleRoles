---

# The interfaces are manually set up because the OPNsense API module does not support it yet.

- name: Setup Virtual IP for the Public IPs
  when: opnsense_manage_vips | bool
  oxlorg.opnsense.interface_vip:
    firewall: "{{ vm_net.ip }}"
    api_key: "{{ api_key }}"
    api_secret: "{{ api_secret }}"
    ssl_verify: false
    match_fields: ["description"]
    address: "{{ vm_net.vip }}/{{ vm_net.netmask }}"
    interface: "{{ vm_net.custom_name }}"
    mode: "carp"
    bind: true
    gateway: "{{ vm_net.gateway }}"
    advertising_base: "{% if vm_is_master %}1{% else %}5{% endif %}"
    description: "Public VIP"
    password: "{{ vip_password }}"
    vhid: 1

- name: Setup Virtual IPs
  when: opnsense_manage_vips | bool and item.vip is not none
  oxlorg.opnsense.interface_vip:
    firewall: "{{ vm_net.ip }}"
    api_key: "{{ api_key }}"
    api_secret: "{{ api_secret }}"
    ssl_verify: false
    match_fields: ["description"]
    address: "{{ item.vip }}/{{ item.mask }}"
    interface: "{{ item.interface_name }}"
    mode: "carp"
    bind: true
    advertising_base: "{% if vm_is_master %}1{% else %}5{% endif %}"
    description: "Trunk VLAN {{ item.id }} VIP"
    password: "{{ vip_password }}"
    vhid: "{{ loop_index + 10 }}"
  loop: "{{ vm_net_trunk.vlans }}"
  loop_control:
    index_var: loop_index

# Segmentation VLANs (40 CI/CD, 45 Monitoring, 48 Utilities) have no VIP
# at all yet — confirmed live (2026-09-10): both routers only have their
# real per-node interface IP (10.0.40.2/.3), no 10.0.40.1 gateway
# anywhere. Added independently of opnsense_manage_vips (stays false):
# enabling it broadly would re-touch the 7 pre-existing trunk VIPs too,
# whose manually-created objects likely have descriptions that don't
# match what this module would generate (blank vs "Trunk VLAN N VIP"),
# risking duplicate/conflicting CARP VIPs on the same vhid+interface —
# exactly what the "disabled until vip_nat.yaml matching is updated"
# note above is about. No such clash risk here: nothing existed before
# for these 3 to conflict with. vhid continues after the existing
# 1 (WAN) and 10-16 (7 pre-existing trunk VLANs) — 17/18/19.
- name: "Setup Virtual IPs for newly segmented VLANs (40/45/48)"
  # reload/apply defaults to false on this module — without it, the VIP
  # object is saved to config.xml but never actually brought up on the
  # interface (confirmed live, 2026-09-10: had to trigger
  # /api/interfaces/vip_settings/reconfigure by hand after this task
  # reported "changed" with no visible CARP interface). The other VIP
  # tasks in this file have the same gap, currently masked by
  # opnsense_manage_vips being false.
  when: item.vip is not none
  oxlorg.opnsense.interface_vip:
    firewall: "{{ vm_net.ip }}"
    api_key: "{{ api_key }}"
    api_secret: "{{ api_secret }}"
    ssl_verify: false
    match_fields: ["description"]
    address: "{{ item.vip }}/{{ item.mask }}"
    interface: "{{ item.interface_name }}"
    mode: "carp"
    bind: true
    advertising_base: "{% if vm_is_master %}1{% else %}5{% endif %}"
    description: "Trunk VLAN {{ item.id }} VIP"
    password: "{{ vip_password }}"
    vhid: "{{ loop_index + 17 }}"
    reload: true
  loop: "{{ vm_net_trunk.vlans | selectattr('id', 'in', [40, 45, 48]) | list }}"
  loop_control:
    index_var: loop_index

# NOTE: outbound NAT clashes with manually created classic NAT rules.
# Set opnsense_manage_nat: true ONLY after migrating classic NAT to new format.
- name: Setup Outbound NAT for the Public VIP
  when: opnsense_manage_nat | bool and item.vip is not none
  oxlorg.opnsense.nat_source:
    firewall: "{{ vm_net.ip }}"
    api_key: "{{ api_key }}"
    api_secret: "{{ api_secret }}"
    ssl_verify: false
    match_fields: ["description"]
    description: "Outbound NAT for Public VIP - VLAN {{ item.id }}"
    sequence: "{{ 1000 + loop_index }}"
    interface: "wan"
    ip_protocol: "inet"
    protocol: "any"
    source_net: "{{ item.network }}/{{ item.mask }}"
    destination_net: "any"
    target: "{{ vm_net.vip }}"
    log: false
    state: present
    enabled: true
  loop: "{{ vm_net_trunk.vlans }}"
  loop_control:
    index_var: loop_index

# Segmentation VLANs (40 CI/CD, 45 Monitoring, 48 Utilities) have no
# classic NAT rule at all yet — added independently of
# opnsense_manage_nat (which stays false: flipping it globally would
# also try to manage NAT for every pre-existing VLAN, clashing with
# their manually-configured classic rules per the note above). No such
# clash risk here since these subnets are brand new.
- name: "Setup Outbound NAT for newly segmented VLANs (40/45/48)"
  when: item.vip is not none
  oxlorg.opnsense.nat_source:
    firewall: "{{ vm_net.ip }}"
    api_key: "{{ api_key }}"
    api_secret: "{{ api_secret }}"
    ssl_verify: false
    match_fields: ["description"]
    description: "Outbound NAT for Public VIP - VLAN {{ item.id }}"
    sequence: "{{ 1040 + loop_index }}"
    interface: "wan"
    ip_protocol: "inet"
    protocol: "any"
    source_net: "{{ item.network }}/{{ item.mask }}"
    destination_net: "any"
    target: "{{ vm_net.vip }}"
    log: false
    state: present
    enabled: true
  loop: "{{ vm_net_trunk.vlans | selectattr('id', 'in', [40, 45, 48]) | list }}"
  loop_control:
    index_var: loop_index
