---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/default/requirements.yml
driver:
  name: docker
platforms:
  # Rôle purement fichiers (blockinfile sur /etc/network/interfaces), pas de
  # démon réseau à tenir en vie : image officielle simple, pas de
  # systemd/privileged/cgroupns (cf. pkgcache.apt).
  - name: proxmox-network-debiantrixie
    image: debian:trixie
    pre_build_image: true
provisioner:
  name: ansible
  options:
    diff: true
  playbooks:
    converge: converge.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
