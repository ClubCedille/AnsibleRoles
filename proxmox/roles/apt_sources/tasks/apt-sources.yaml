- name: Check if a legacy APT sources list exists
  ansible.builtin.stat:
    path: /etc/apt/sources.list
  register: apt_sources_existing_list
  become: true

- name: Read legacy APT sources list content
  # lookup('file', ...) lit sur le contrôleur Ansible, pas sur l'hôte géré :
  # slurp lit sur la cible et rend aussi le rôle idempotent. Cf. AnsibleRoles#129.
  ansible.builtin.slurp:
    src: /etc/apt/sources.list
  register: apt_sources_list_content
  when: apt_sources_existing_list.stat.exists
  become: true

- name: Backup legacy APT sources list before neutralizing it
  # remote_src: sans lui, "src" était lu sur le contrôleur Ansible au lieu
  # de l'hôte géré. Cf. AnsibleRoles#129.
  ansible.builtin.copy:
    remote_src: true
    src: /etc/apt/sources.list
    dest: /etc/apt/sources.list.bak
    backup: true
    mode: '0644'
    owner: root
    group: root
  when: >-
    apt_sources_existing_list.stat.exists and
    (apt_sources_list_content.content | b64decode | trim | length > 0)
  become: true

- name: Empty the legacy APT sources list
  # Les dépôts sont désormais gérés en deb822 dans apt_sources_output_file --
  # du contenu classique ici le dupliquerait (AnsibleRoles#131). Le parc réel
  # a toujours ce fichier présent mais vide.
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    content: ""
    mode: '0644'
    owner: root
    group: root
  when: >-
    apt_sources_existing_list.stat.exists and
    (apt_sources_list_content.content | b64decode | trim | length > 0)
  become: true

- name: Remove per-repo source files superseded by apt_sources_output_file
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop: "{{ apt_sources_obsolete_files }}"
  notify: Refresh APT cache
  become: true

- name: Validate the selected channels/releases
  ansible.builtin.assert:
    that:
      - not apt_sources_pve.enabled or apt_sources_pve.channel in apt_sources_pve_channels
      - not apt_sources_pbs.enabled or apt_sources_pbs.channel in apt_sources_pbs_channels
      - not apt_sources_ceph.enabled or apt_sources_ceph.channel in apt_sources_ceph_channels
      - not apt_sources_ceph.enabled or apt_sources_ceph.release in apt_sources_ceph_releases
    fail_msg: >-
      Channel ou release invalide -- pve.channel/pbs.channel doivent être parmi
      {{ apt_sources_pve_channels.keys() | list }}, ceph.channel parmi
      {{ apt_sources_ceph_channels.keys() | list }}, ceph.release parmi
      {{ apt_sources_ceph_releases }}.

- name: Ensure the Grafana APT keyring directory exists
  ansible.builtin.file:
    path: "{{ apt_sources_grafana.key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: apt_sources_grafana.enabled | bool
  become: true

- name: Download the Grafana APT repository key
  ansible.builtin.get_url:
    url: "{{ apt_sources_grafana.key_url }}"
    dest: "{{ apt_sources_grafana.key_path }}"
    owner: root
    group: root
    mode: '0644'
  when: apt_sources_grafana.enabled | bool
  become: true

- name: Build the combined stanza list
  ansible.builtin.set_fact:
    apt_sources_all_stanzas: >-
      {{
        ([{
          'types': 'deb',
          'uris': apt_sources_debian.mirror,
          'suites': apt_sources_debian.version ~ ' ' ~ apt_sources_debian.version ~ '-updates',
          'components': apt_sources_debian.components,
          'signed_by': '/usr/share/keyrings/debian-archive-keyring.gpg',
        }, {
          'types': 'deb',
          'uris': apt_sources_debian.security_mirror,
          'suites': apt_sources_debian.version ~ '-security',
          'components': apt_sources_debian.components,
          'signed_by': '/usr/share/keyrings/debian-archive-keyring.gpg',
        }] if apt_sources_debian.enabled else [])
        + ([{
          'types': 'deb',
          'uris': apt_sources_pve_channels[apt_sources_pve.channel].uris,
          'suites': apt_sources_pve.version,
          'components': apt_sources_pve_channels[apt_sources_pve.channel].components,
          'signed_by': '/usr/share/keyrings/proxmox-archive-keyring.gpg',
        }] if apt_sources_pve.enabled else [])
        + ([{
          'types': 'deb',
          'uris': apt_sources_pbs_channels[apt_sources_pbs.channel].uris,
          'suites': apt_sources_pbs.version,
          'components': apt_sources_pbs_channels[apt_sources_pbs.channel].components,
          'signed_by': '/usr/share/keyrings/proxmox-archive-keyring.gpg',
        }] if apt_sources_pbs.enabled else [])
        + ([{
          'types': 'deb',
          'uris': apt_sources_ceph_channels[apt_sources_ceph.channel].host ~ '/ceph-' ~ apt_sources_ceph.release,
          'suites': apt_sources_ceph.version,
          'components': apt_sources_ceph_channels[apt_sources_ceph.channel].components,
          'signed_by': '/usr/share/keyrings/proxmox-archive-keyring.gpg',
        }] if apt_sources_ceph.enabled else [])
        + ([{
          'types': 'deb',
          'uris': apt_sources_grafana.uris,
          'suites': apt_sources_grafana.suites,
          'components': apt_sources_grafana.components,
          'signed_by': apt_sources_grafana.key_path,
        }] if apt_sources_grafana.enabled else [])
      }}

- name: Write the combined deb822 APT source file
  ansible.builtin.template:
    src: sources.j2
    dest: "{{ apt_sources_output_file }}"
    owner: root
    group: root
    mode: '0644'
  notify: Refresh APT cache
  become: true
