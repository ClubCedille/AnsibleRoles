apt_sources_debian_version: trixie
apt_sources_pve_repository: no-subscription

# tentacle : le parc a migré depuis squid (constaté en prod, AnsibleRoles#131).
apt_sources_ceph_repository: tentacle

apt_sources_debian_mirror: http://deb.debian.org/debian/
apt_sources_debian_security_mirror: http://security.debian.org/debian-security/
apt_sources_debian_components: main contrib non-free-firmware

# Un item = un fichier deb822 sous /etc/apt/sources.list.d/, avec une ou
# plusieurs strophes (Types/URIs/Suites/Components/Signed-By).
apt_sources_repositories:
  - filename: proxmox.sources
    stanzas:
      - types: deb
        uris: http://download.proxmox.com/debian/pve
        suites: "{{ apt_sources_debian_version }}"
        components: "pve-{{ apt_sources_pve_repository }}"
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
  - filename: ceph.sources
    stanzas:
      - types: deb
        uris: "http://download.proxmox.com/debian/ceph-{{ apt_sources_ceph_repository }}"
        suites: "{{ apt_sources_debian_version }}"
        components: "{{ apt_sources_pve_repository }}"
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
  - filename: debian.sources
    stanzas:
      - types: deb
        uris: "{{ apt_sources_debian_mirror }}"
        suites: "{{ apt_sources_debian_version }} {{ apt_sources_debian_version }}-updates"
        components: "{{ apt_sources_debian_components }}"
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
      - types: deb
        uris: "{{ apt_sources_debian_security_mirror }}"
        suites: "{{ apt_sources_debian_version }}-security"
        components: "{{ apt_sources_debian_components }}"
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
