---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/default/requirements.yml
driver:
  name: docker
platforms:
  # Rôle purement fichiers, pas de démon : image officielle simple suffit,
  # pas besoin de systemd/privileged/cgroupns (cf. pkgcache.apt).
  - name: apt-sources-debian-trixie
    image: debian:trixie
    pre_build_image: true
provisioner:
  name: ansible
  options:
    diff: true
  playbooks:
    converge: converge.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
