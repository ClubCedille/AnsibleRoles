---
- name: Converge
  hosts: all
  # Image officielle minimale sans sudo ; le rôle a "become: true" en dur
  # sur ses tâches, donc on l'installe avant plutôt que de le contourner.
  # Tous les blocs activés (y compris ceph/pbs/grafana, désactivés par
  # défaut) pour couvrir tous les chemins de code. AnsibleRoles#132.
  vars:
    apt_sources_ceph:
      enabled: true
      version: trixie
      release: tentacle
      channel: no-subscription
    apt_sources_pbs:
      enabled: true
      version: trixie
      channel: no-subscription
    apt_sources_grafana:
      enabled: true
      key_url: https://apt.grafana.com/gpg-full.key
      key_path: /etc/apt/keyrings/grafana.asc
      uris: https://apt.grafana.com
      suites: stable
      components: main
  pre_tasks:
    - name: Install sudo (missing from the minimal debian:trixie image)
      ansible.builtin.apt:
        name: sudo
  roles:
    - role: cedille.proxmox.apt_sources
