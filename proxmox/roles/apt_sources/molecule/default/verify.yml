---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Stat the combined deb822 source file
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/pve.sources
      register: molecule_verify_combined_file

    - name: Assert the combined file was written
      ansible.builtin.assert:
        that:
          - molecule_verify_combined_file.stat.exists
        fail_msg: "pve.sources n'a pas été créé."

    - name: Assert the per-repo files it supersedes are gone
      ansible.builtin.stat:
        path: "/etc/apt/sources.list.d/{{ item }}"
      register: molecule_verify_obsolete_files
      loop:
        - proxmox.sources
        - ceph.sources
        - debian.sources
        - grafana.sources

    - name: Assert no obsolete per-repo file remains
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: "{{ item.item }} aurait dû être supprimé (repris dans pve.sources)."
      loop: "{{ molecule_verify_obsolete_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the rendered combined source file
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/pve.sources
      register: molecule_verify_combined_content

    - name: Assert every repository (proxmox, ceph, debian, grafana) is present
      ansible.builtin.assert:
        that:
          - "'download.proxmox.com/debian/pve' in (molecule_verify_combined_content.content | b64decode)"
          - "'ceph-tentacle' in (molecule_verify_combined_content.content | b64decode)"
          - "'trixie trixie-updates' in (molecule_verify_combined_content.content | b64decode)"
          - "'trixie-security' in (molecule_verify_combined_content.content | b64decode)"
          - "'apt.grafana.com' in (molecule_verify_combined_content.content | b64decode)"
        fail_msg: "Un des dépôts attendus est absent de pve.sources."

    - name: Stat the Grafana signing key
      ansible.builtin.stat:
        path: /etc/apt/keyrings/grafana.asc
      register: molecule_verify_grafana_key

    - name: Assert the Grafana signing key was downloaded
      ansible.builtin.assert:
        that:
          - molecule_verify_grafana_key.stat.exists
        fail_msg: "La clé APT Grafana n'a pas été téléchargée."

    - name: Confirm apt can actually read every configured repository
      # Possible depuis AnsibleRoles#132 : prepare.yml installe le vrai
      # trousseau Proxmox (présent nativement sur tout hôte PVE réel),
      # donc les 4 dépôts sont maintenant vérifiables signature comprise.
      ansible.builtin.command: apt-get update
      register: molecule_verify_apt_update
      changed_when: false

    - name: Assert apt-get update reports no signature/repo error
      ansible.builtin.assert:
        that:
          - "'is not signed' not in molecule_verify_apt_update.stdout"
          - "'is not signed' not in molecule_verify_apt_update.stderr"
        fail_msg: "apt-get update signale un dépôt non signé ou en erreur."

    - name: Stat the legacy sources list
      ansible.builtin.stat:
        path: /etc/apt/sources.list
      register: molecule_verify_legacy_list

    - name: Assert the legacy sources list is absent or empty
      # Le rôle n'y touche que s'il existait déjà avec du contenu non géré
      # (AnsibleRoles#131) -- l'image debian:trixie de test ne l'embarque
      # pas du tout, contrairement au parc réel qui le garde vide.
      ansible.builtin.assert:
        that:
          - not molecule_verify_legacy_list.stat.exists or molecule_verify_legacy_list.stat.size == 0
        fail_msg: "/etc/apt/sources.list ne devrait jamais contenir de contenu non géré."
