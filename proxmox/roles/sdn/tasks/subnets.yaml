---
- name: Ensure SDN subnets are in desired state
  community.proxmox.proxmox_subnet:
    api_user: "{{ sdn_proxmox_api.user }}"
    api_password: "{{ sdn_proxmox_api.password }}"
    api_host: "{{ sdn_proxmox_api.host }}"
    api_port: "{{ sdn_proxmox_api.port | default(8006) }}"
    validate_certs: "{{ sdn_proxmox_api.validate_certs | default(false) }}"
    subnet: "{{ item.subnet }}"
    vnet: "{{ item.vnet }}"
    zone: "{{ item.zone }}"
    gateway: "{{ item.gateway | default(omit) }}"
    snat: "{{ item.snat | default(false) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ sdn_subnets }}"
  loop_control:
    label: "{{ item.zone }}/{{ item.vnet }}:{{ item.subnet }}"
  throttle: 1
  delegate_to: localhost
  no_log: true
