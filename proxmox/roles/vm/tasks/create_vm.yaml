---


- name: Stop the VMs if to be deleted
  community.proxmox.proxmox_kvm:
    # Proxmox API connection details
    api_user: "{{ vm_proxmox_api.user }}"
    api_password: "{{ vm_proxmox_api.password }}"
    api_host: "{{ vm_proxmox_api.host }}"
    # VM identification
    vmid: "{{ vm_id }}"
    # Delete the VM
    state: stopped
  when: vm_delete_if_exists | default(false)
  delegate_to: localhost


- name: Delete the VM if needed
  community.proxmox.proxmox_kvm:
    # Proxmox API connection details
    api_user: "{{ vm_proxmox_api.user }}"
    api_password: "{{ vm_proxmox_api.password }}"
    api_host: "{{ vm_proxmox_api.host }}"
    # VM identification
    vmid: "{{ vm_id }}"
    # Delete the VM
    state: absent
  when: vm_delete_if_exists | default(false)
  delegate_to: localhost

- name: Determine effective list of NICs (vm_nets takes precedence over legacy vm_net)
  ansible.builtin.set_fact:
    _vm_net_list: "{{ vm_nets if (vm_nets | default([]) | length > 0) else [vm_net] }}"
  when: not (vm_delete_if_exists | default(false))

- name: Check whether `make gen-mac` is available in the calling repo
  # Pas de chdir explicite : on part du principe que le CWD est déjà la
  # racine du repo appelant (cas normal -- make ou ansible-playbook lancés
  # depuis là), pas de chemin relatif fiable à déduire de playbook_dir
  # (profondeur variable selon l'appelant).
  ansible.builtin.command: make -n gen-mac
  register: _gen_mac_target_check
  changed_when: false
  failed_when: false
  delegate_to: localhost
  when: not (vm_delete_if_exists | default(false))

# Une MAC générée par Proxmox à la création n'est pas déclarative : elle ne
# peut pas être auditée/reproduite depuis Ansible seul (cf. l'historique de
# playbooks/proxmox/census_vms.yaml dans AnsibleInfra, qui a dû aller la
# redécouvrir après coup). Requis depuis 2.0.0.
- name: Fail early if a NIC is missing its mac field
  ansible.builtin.fail:
    msg: >-
      {{ 'vm_nets[' ~ idx ~ ']' if (vm_nets | default([]) | length > 0) else 'vm_net' }}
      n'a pas de champ `mac` défini -- requis depuis cedille.proxmox.vm 2.0.0.
      Générez-en une avec
      {{ 'make gen-mac' if _gen_mac_target_check.rc == 0 else (role_path ~ '/scripts/gen_mac.py') }}
      et ajoutez-la dans le host_vars correspondant.
  loop: "{{ _vm_net_list }}"
  loop_control:
    index_var: idx
    label: "NIC {{ idx }}"
  when:
    - not (vm_delete_if_exists | default(false))
    - not (item.mac | default(''))

- name: Build net<N>/ipconfig<N> maps from the NIC list
  ansible.builtin.set_fact:
    _vm_net_map: >-
      {{ (_vm_net_map | default({})) | combine({
           ('net' ~ idx): (
             (item.device | default('virtio')) ~ ',bridge=' ~ item.bridge
             ~ ',tag=' ~ (item.vlan | default('1'))
             ~ ',mtu=' ~ (item.mtu | default(1500))
             ~ ',macaddr=' ~ item.mac
           )
      }) }}
    _vm_ipconfig_map: >-
      {{ (_vm_ipconfig_map | default({})) | combine(
           {('ipconfig' ~ idx): ('ip=' ~ item.ip ~ '/' ~ item.netmask ~ ',gw=' ~ item.gateway)}
           if (item.ip | default('')) | length > 0 else {}
      ) }}
  loop: "{{ _vm_net_list }}"
  loop_control:
    index_var: idx
    label: "NIC {{ idx }}"
  when: not (vm_delete_if_exists | default(false))

- name: Ensure Proxmox pool exists
  community.proxmox.proxmox_pool:
    api_user: "{{ vm_proxmox_api.user }}"
    api_password: "{{ vm_proxmox_api.password }}"
    api_host: "{{ vm_proxmox_api.host }}"
    poolid: "{{ vm_pool }}"
    comment: "{{ vm_pool_comment | default(omit) }}"
    state: present
  when: vm_pool | default('') | length > 0
  delegate_to: localhost
  throttle: 1

- name: Create the basic VM
  community.proxmox.proxmox_kvm:
    description: "=== ANSIBLE MANAGED VM ==="
    # Proxmox API connection details
    api_user: "{{ vm_proxmox_api.user }}"
    api_password: "{{ vm_proxmox_api.password }}"
    api_host: "{{ vm_proxmox_api.host }}"
    # VM identification
    vmid: "{{ vm_id }}"
    name: "{{ vm_name }}"
    node: "{{ vm_proxmox_node }}"
    # Pool assignment only takes effect at creation — proxmox_kvm can't
    # move an existing VM's pool via the config-update API endpoint, see
    # "Ensure VM pool membership" below for that case. tags is set here
    # too for genuinely new VMs, but state:present without update:true is
    # a documented no-op on a VM that already exists (see resize_vm.yaml)
    # — see "Ensure VM tags" below for the case that actually matters for
    # existing VMs.
    pool: "{{ vm_pool | default(omit) }}"
    tags: "{{ vm_tags | default(omit) }}"
    # VM resources
    machine: "q35"
    cpu: "{{ vm_cpu_type | default('host') }}"
    cores: "{{ vm_cpu_cores }}"
    memory: "{{ vm_memory_mb }}"
    net: "{{ _vm_net_map }}"
    # Cloud Init configuration
    # Will not apply on OPNsense VMs as they do not support cloud-init
    ide:
      ide0: "{{ vm_cloud_init_storage }}:cloudinit,format={{ vm_disk_format }}"
    ciuser: "{{ vm_user }}"
    cipassword: "{{ vm_password }}"
    sshkeys: "{{ vm_sshkeys }}"
    searchdomains: "{{ vm_net.search_domain | default('localdomain') }}"
    nameservers: "{{ omit if vm_net.nameservers is not defined else vm_net.nameservers }}"
    ipconfig: "{{ _vm_ipconfig_map }}"
    ostype: "{{ vm_os_type | default('l26') }}"
    onboot: "{{ vm_onboot | default(true) }}"
    agent: true
    state: present
  when: not (vm_delete_if_exists | default(false))
  delegate_to: localhost

- name: Attach disk to the VM
  community.proxmox.proxmox_disk:
    # Proxmox API connection details
    api_user: "{{ vm_proxmox_api.user }}"
    api_password: "{{ vm_proxmox_api.password }}"
    api_host: "{{ vm_proxmox_api.host }}"
    # VM identification
    vmid: "{{ vm_id }}"
    # Disk configuration
    disk: "{{ vm_disk_device | default('virtio0') }}"
    import_from: "{{ vm_disk_image_path }}"
    storage: "{{ vm_disk_storage }}"
    format: "{{ vm_disk_format | default('qcow2') }}"
    discard: true
    state: present
  when: not (vm_delete_if_exists | default(false))
  delegate_to: localhost

- name: Ensure VM pool membership
  # community.proxmox 2.0.0 fixed the pool_member idempotency bug this task
  # used to work around (state:present used to error instead of no-op'ing
  # when the VM was already a member — confirmed live, 2026-09-10). The
  # module now diffs current vs. desired membership itself (reconcile_members)
  # and declares full check_mode support, so the custom failed_when we used
  # to have here was both unnecessary and actively broken under --check —
  # removed, relying on the module's native idempotency instead.
  #
  # Still excluded from --check (see `when` below): reconcile_members()
  # mixes current_vm_ids (ints, straight from the Proxmox API's pool member
  # list) with desired_vm_ids (strings, from _resolve_member's str(int(raw)))
  # in a single set. In real-apply mode the code path that hits this stays
  # string-only (vms_to_add = desired - current, unaffected by the mismatched
  # existing entries) so it's harmless there — but the check_mode/no-op
  # preview path unions the two sets before sorting them for the diff
  # output, crashing with "'<' not supported between instances of 'int' and
  # 'str'" (confirmed in CI dry-run, 2026-09-17 — a real upstream bug in
  # community.proxmox 2.0.0, not something fixable from the calling side).
  # Revisit once that's fixed upstream.
  #
  # Still throttled to 1: the Proxmox pool-update endpoint does a read-
  # modify-write on the pool's member list, so concurrent host runs
  # targeting the same pool raced and produced unexplained failures
  # (confirmed live — 6 hosts run in parallel against the same new pool
  # failed with no usable error message, one at a time succeeded fine).
  community.proxmox.proxmox_pool_member:
    api_user: "{{ vm_proxmox_api.user }}"
    api_password: "{{ vm_proxmox_api.password }}"
    api_host: "{{ vm_proxmox_api.host }}"
    poolid: "{{ vm_pool }}"
    members:
      - vm: "{{ vm_id }}"
    state: present
  when: >-
    vm_pool | default('') | length > 0 and
    not (vm_delete_if_exists | default(false)) and
    not ansible_check_mode
  delegate_to: localhost
  throttle: 1

- name: Ensure VM tags
  # "Create the basic VM" above sets tags too, but state:present without
  # update:true is a documented no-op on a VM that already exists (see
  # resize_vm.yaml) — this is the task that actually converges tags on
  # already-existing VMs.
  community.proxmox.proxmox_kvm:
    api_user: "{{ vm_proxmox_api.user }}"
    api_password: "{{ vm_proxmox_api.password }}"
    api_host: "{{ vm_proxmox_api.host }}"
    vmid: "{{ vm_id }}"
    node: "{{ vm_proxmox_node }}"
    tags: "{{ vm_tags }}"
    state: present
    update: true
  when: vm_tags | default([]) | length > 0 and not (vm_delete_if_exists | default(false))
  delegate_to: localhost

- name: Resize the VM disk
  community.proxmox.proxmox_disk:
    # Proxmox API connection details
    api_user: "{{ vm_proxmox_api.user }}"
    api_password: "{{ vm_proxmox_api.password }}"
    api_host: "{{ vm_proxmox_api.host }}"
    # VM identification
    vmid: "{{ vm_id }}"
    # Disk resizing
    disk: "{{ vm_disk_device | default('virtio0') }}"
    size: "{{ vm_disk_size | default('15G') }}" # Can't be shrunk and needs useable
    state: resized
  when: vm_disk_size is defined and not (vm_delete_if_exists | default(false))
  delegate_to: localhost

- name: Change the boot order
  community.proxmox.proxmox_kvm:
    # Proxmox API connection details
    api_user: "{{ vm_proxmox_api.user }}"
    api_password: "{{ vm_proxmox_api.password }}"
    api_host: "{{ vm_proxmox_api.host }}"
    # VM identification
    vmid: "{{ vm_id }}"
    node: "{{ vm_proxmox_node }}"
    # Boot order configuration
    boot: "order={{ vm_disk_device | default('virtio0') }}"
    update: true
  when: not (vm_delete_if_exists | default(false))
  delegate_to: localhost

- name: Start the VM
  community.proxmox.proxmox_kvm:
    # Proxmox API connection details
    api_user: "{{ vm_proxmox_api.user }}"
    api_password: "{{ vm_proxmox_api.password }}"
    api_host: "{{ vm_proxmox_api.host }}"
    # VM identification
    vmid: "{{ vm_id }}"
    # Start the VM
    state: started
  when: (vm_start_after_creation | default(false)) and not (vm_delete_if_exists | default(false))
  delegate_to: localhost

