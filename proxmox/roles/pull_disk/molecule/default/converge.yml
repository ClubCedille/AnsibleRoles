---
- name: Converge
  hosts: all
  vars:
    # /var/lib/vz n'existe pas dans un conteneur de test isolé.
    pull_disk_image_path: /tmp/pulled_disks
    pull_disk_images:
      # Petit fichier texte réel, téléchargement rapide en CI (pas une
      # image disque de plusieurs centaines de Mo).
      - url: https://raw.githubusercontent.com/ClubCedille/AnsibleRoles/main/README.md
        dest_filename: pulled_disk_test_file
  # Image officielle minimale sans sudo ; le rôle a "become: true" en dur
  # sur ses tâches, donc on l'installe avant plutôt que de le contourner.
  pre_tasks:
    - name: Install sudo (missing from the minimal debian:bookworm image)
      ansible.builtin.apt:
        name: sudo
        update_cache: true
  roles:
    - role: cedille.proxmox.pull_disk
