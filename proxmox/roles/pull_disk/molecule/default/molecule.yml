---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/default/requirements.yml
driver:
  name: docker
platforms:
  # Rôle purement fichiers (get_url), pas de démon : image officielle
  # simple suffit, pas besoin de systemd/privileged/cgroupns.
  - name: proxmox-pull-disk-debian-bookworm
    image: debian:bookworm
    pre_build_image: true
provisioner:
  name: ansible
  options:
    diff: true
  playbooks:
    converge: converge.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
