---
# community.proxmox.proxmox_access_acl et ansible.builtin.uri ne supportent pas
# check_mode. Les lectures ci-dessous sont donc forcées avec `check_mode: false`
# (elles ne modifient pas l'état Proxmox) pour que le dry-run puisse rapporter
# l'écart entre l'état désiré et l'état courant.

- name: Get a Proxmox API ticket for read-only verification
  ansible.builtin.uri:
    url: "https://{{ permissions_proxmox_api.host }}:{{ permissions_proxmox_api.port | default(8006) }}/api2/json/access/ticket"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ permissions_proxmox_api.user }}"
      password: "{{ permissions_proxmox_api.password }}"
    validate_certs: "{{ permissions_proxmox_api.validate_certs | default(false) | bool }}"
    status_code: 200
    return_content: true
  register: permissions_api_ticket
  changed_when: false
  no_log: true
  check_mode: false
  delegate_to: localhost

- name: Read current ACLs from Proxmox API
  ansible.builtin.uri:
    url: "https://{{ permissions_proxmox_api.host }}:{{ permissions_proxmox_api.port | default(8006) }}/api2/json/access/acl"
    method: GET
    headers:
      Cookie: "PVEAuthCookie={{ permissions_api_ticket.json.data.ticket }}"
    validate_certs: "{{ permissions_proxmox_api.validate_certs | default(false) | bool }}"
    status_code: 200
    return_content: true
  register: permissions_current_acls
  changed_when: false
  no_log: true
  check_mode: false
  delegate_to: localhost

- name: Initialize current ACL key index
  ansible.builtin.set_fact:
    permissions_current_keys: []

- name: Build current ACL key index
  ansible.builtin.set_fact:
    permissions_current_keys: >-
      {{ permissions_current_keys + [item.path ~ '|' ~ item.roleid ~ '|'
         ~ item.type ~ '|' ~ item.ugid] }}
  loop: "{{ permissions_current_acls.json.data }}"
  loop_control:
    label: "{{ item.path }}"

- name: Initialize drift lists
  ansible.builtin.set_fact:
    permissions_missing_acls: []
    permissions_stale_acls: []

- name: Collect desired ACLs missing from Proxmox
  ansible.builtin.set_fact:
    permissions_missing_acls: "{{ permissions_missing_acls + [item] }}"
  loop: '{{ permissions_acls | json_query("[?state!=''absent'']") | list }}'
  loop_control:
    label: "{{ item.path }}: {{ item.ugid }}"
  when: >-
    (item.path ~ '|' ~ item.roleid ~ '|'
     ~ (item.type | default('group')) ~ '|' ~ item.ugid)
    not in permissions_current_keys

- name: Collect ACLs still present though marked absent
  ansible.builtin.set_fact:
    permissions_stale_acls: "{{ permissions_stale_acls + [item] }}"
  loop: '{{ permissions_acls | json_query("[?state==''absent'']") | list }}'
  loop_control:
    label: "{{ item.path }}: {{ item.ugid }}"
  when: >-
    (item.path ~ '|' ~ item.roleid ~ '|'
     ~ (item.type | default('group')) ~ '|' ~ item.ugid)
    in permissions_current_keys

- name: Report drift between desired and current ACLs
  ansible.builtin.debug:
    msg:
      - "{{ permissions_missing_acls | length }} ACL absentes (seraient créées)"
      - "{{ permissions_missing_acls | map(attribute='ugid') | list }}"
      - "{{ permissions_stale_acls | length }} ACL à révoquer (seraient supprimées)"
      - "{{ permissions_stale_acls | map(attribute='ugid') | list }}"
  when: permissions_missing_acls | length > 0 or permissions_stale_acls | length > 0

- name: Fail on drift when strict verification is requested
  ansible.builtin.assert:
    that:
      - permissions_missing_acls | length == 0
      - permissions_stale_acls | length == 0
    fail_msg: "L'état Proxmox ne correspond pas aux ACL désirées."
  when: permissions_verify_strict | bool
