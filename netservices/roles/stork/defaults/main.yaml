---
netservices_stork:
  enabled: true
  supported_distribution: Ubuntu
  supported_distribution_version: "24.04"

  install:
    update_cache: true
    package_state: present
    packages:
      - isc-stork-server
      - isc-stork-agent
    repository:
      # Dépôt Cloudsmith officiel ISC : les paquets stork-* ne sont pas dans Ubuntu (cf. PR AnsibleRoles).
      uri: https://dl.cloudsmith.io/public/isc/stork/deb/ubuntu
      key_url: https://dl.cloudsmith.io/public/isc/stork/gpg.key

  service:
    server_name: isc-stork-server
    agent_name: isc-stork-agent
    state: started
    enabled: true

  paths:
    config_dir: /etc/stork
    server_env: /etc/stork/server.env
    agent_env: /etc/stork/agent.env

  server:
    http_host: 0.0.0.0
    http_port: 8080
    database:
      host: 127.0.0.1
      port: 5432
      name: stork
      user: stork
      password: ""

  agent:
    # Déploiement mono-hôte par défaut (server + agent colocalisés) : port
    # dédié pour éviter la collision avec le port REST du serveur (8080).
    host: 127.0.0.1
    port: 8081
    server_url: http://127.0.0.1:8080
