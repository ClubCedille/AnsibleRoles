---
netservices_dhcp:
  enabled: true
  supported_distribution: Ubuntu
  supported_distribution_version: "24.04"

  install:
    update_cache: true
    package_state: present
    packages:
      # libdhcp_ha.so et les autres hooks viennent de kea-common (dépendance
      # transitive) -- "kea-hooks" n'existe pas comme paquet APT (AnsibleRoles#122).
      - kea-dhcp4-server
      - kea-ctrl-agent

  service:
    dhcp4_name: kea-dhcp4-server
    ctrl_agent_name: kea-ctrl-agent
    state: started
    enabled: true

  paths:
    dhcp4_config: /etc/kea/kea-dhcp4.conf
    ctrl_agent_config: /etc/kea/kea-ctrl-agent.conf
    dhcp4_control_socket: /run/kea/kea4-ctrl-socket
    # Requis par ConditionFileNotEmpty= du service packagé Ubuntu -- sans ce
    # fichier kea-ctrl-agent ne démarre jamais (AnsibleRoles#122). Non branché
    # sur une authentification HTTP réelle par ce rôle (voir kea_ctrl_agent_config).
    ctrl_agent_api_password: /etc/kea/kea-api-password

  ctrl_agent:
    api_password: "please-change-me"

  ha:
    enabled: true
    mode: hot-standby
    this_server_name: "{{ inventory_hostname }}"
    heartbeat_delay: 10000
    max_response_delay: 60000
    max_ack_delay: 5000
    max_unacked_clients: 10
    sync_page_limit: 10000
    primary:
      name: dhcp-primary
      url: http://10.0.0.10:8000/
    secondary:
      name: dhcp-secondary
      url: http://10.0.0.11:8000/

  kea_dhcp4_config:
    Dhcp4:
      interfaces-config:
        interfaces:
          - "*"
      control-socket:
        socket-type: unix
        socket-name: "{{ netservices_dhcp.paths.dhcp4_control_socket }}"
      lease-database:
        type: memfile
        persist: true
        name: /var/lib/kea/kea-leases4.csv
      valid-lifetime: 4000
      renew-timer: 1000
      rebind-timer: 2000
      subnet4: []
      option-data: []
      hooks-libraries:
        # "high-availability" doit être une liste (une erreur de config sinon)
        # et le rôle du 2e pair doit être "standby" pour le mode hot-standby --
        # "secondary" n'est valide qu'en mode load-balancing (AnsibleRoles#122).
        - library: /usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_ha.so
          parameters:
            high-availability:
              - this-server-name: "{{ netservices_dhcp.ha.this_server_name }}"
                mode: "{{ netservices_dhcp.ha.mode }}"
                heartbeat-delay: 10000
                max-response-delay: 60000
                max-ack-delay: 5000
                max-unacked-clients: 10
                sync-page-limit: 10000
                peers:
                  - name: "{{ netservices_dhcp.ha.primary.name }}"
                    url: "{{ netservices_dhcp.ha.primary.url }}"
                    role: primary
                    auto-failover: true
                  - name: "{{ netservices_dhcp.ha.secondary.name }}"
                    url: "{{ netservices_dhcp.ha.secondary.url }}"
                    role: "{{ 'standby' if netservices_dhcp.ha.mode == 'hot-standby' else 'secondary' }}"
                    auto-failover: true
      loggers:
        # "output_options" (underscore) -- pas "output-options", contrairement
        # aux autres clés Kea (AnsibleRoles#122).
        - name: kea-dhcp4
          output_options:
            - output: stdout
          severity: INFO

  # Optional client classes injected into kea_dhcp4_config.Dhcp4.client-classes.
  # Use to deliver different DHCP options based on vendor-class-identifier or other
  # client attributes. Appended after the base config — no need to override the whole
  # kea_dhcp4_config structure.
  # Example:
  #   client_classes:
  #     - name: my_class
  #       test: "option[60].text == 'myvendor'"
  #       option-data:
  #         - name: vendor-encapsulated-options
  #           data: "deadbeef"
  client_classes: []

  # Optional extra Kea hook libraries to load alongside the built-in HA hook.
  # Example: ["/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so"]
  extra_hook_libraries: []

  kea_ctrl_agent_config:
    Control-agent:
      http-host: 0.0.0.0
      http-port: 8000
      control-sockets:
        dhcp4:
          socket-type: unix
          socket-name: "{{ netservices_dhcp.paths.dhcp4_control_socket }}"
