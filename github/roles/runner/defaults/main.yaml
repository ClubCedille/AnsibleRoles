---
github_runner_version: "2.337.0"
github_runner_arch: x64

github_runner_service:
  user: github-runner
  group: github-runner

github_runner_paths:
  archive_download_dir: /tmp
  data_dir: /var/lib/github-runner

# Organisation GitHub cible (enregistrement au niveau org, pas repo).
# https://github.com/{{ github_runner_org }}
github_runner_org: "REPLACE_WITH_GITHUB_ORG"

# Jeton d'enregistrement — valide 1h seulement, calculé à l'exécution du
# playbook (jamais une valeur statique vaultée). Voir docs/README.md.
github_runner_registration_token: "REPLACE_WITH_RUNTIME_REGISTRATION_TOKEN"

# Nom du runner tel qu'affiché dans GitHub — par défaut le premier segment
# du hostname (ex: forgejo-runner-dind01.mgmt.etsmtl.club -> forgejo-runner-dind01).
github_runner_name: "{{ inventory_hostname.split('.')[0] }}"

github_runner_labels:
  - "generic"

# Runner group côté organisation GitHub (doit déjà exister — voir la play
# "Ensure GitHub org runner groups exist" dans le playbook AnsibleInfra, qui
# les crée avant l'enregistrement). Un groupe par pool, pas le groupe
# "Default" implicite.
github_runner_group: "REPLACE_WITH_RUNNER_GROUP"

github_runner_replace_existing: true

# Extra system groups (e.g. "kvm") and apt packages (e.g. qemu-system-x86)
# for runners that need host-level device access. Docker access is always
# granted (runner user added to the "docker" group) since jobs execute
# natively on the host unless the workflow specifies its own container:.
github_runner_extra_groups: []
github_runner_extra_packages: []

# Mode containerized : le runner tourne dans un conteneur Docker privilégié
# avec son propre dockerd imbriqué (nested DinD), au lieu du binaire
# actions-runner installé directement sur l'hôte (mode par défaut ci-dessus).
# Les jobs continuent de s'exécuter comme des process natifs à l'intérieur de
# ce conteneur (comportement standard actions-runner, inchangé), mais ce
# conteneur — pas l'hôte — est la frontière d'isolation, et `docker build`
# dans un job parle au dockerd imbriqué, jamais à celui de l'hôte.
#
# Limite connue : le conteneur est long-vécu (restart_policy: always) et non
# éphémère par job — un vrai runner "un conteneur jetable par job" exigerait
# de reminter un jeton d'enregistrement à chaque redémarrage, ce que ce rôle
# ne fait pas encore. Isolation vis-à-vis de l'hôte garantie ; isolation
# stricte job-à-job (jobs séquentiels sur le même runner) non garantie.
#
# À valider avant premier déploiement en prod : le comportement exact de
# github_runner_container_image (démarrage du dockerd imbriqué via
# DOCKER_IN_DOCKER, chemin de persistance de l'état d'enregistrement) dépend
# de la version de l'image tierce — vérifier sa documentation actuelle avant
# d'activer ce mode sur un pool de production.
github_runner_containerized: false
github_runner_container_image: "myoung34/github-runner:latest"
github_runner_docker_in_docker: true
