---
- name: Ensure the GitHub org is configured
  ansible.builtin.assert:
    that:
      - github_runner_org != "REPLACE_WITH_GITHUB_ORG"
    fail_msg: >-
      github_runner_org still has its placeholder value — set it in
      inventories/infra/group_vars/github_runners.yaml before running this role.

- name: Create github-runner system group
  ansible.builtin.group:
    name: "{{ github_runner_service.group }}"
    system: true

- name: Install extra packages for host-level device access
  ansible.builtin.apt:
    name: "{{ github_runner_extra_packages }}"
    state: present
    update_cache: true
  when: github_runner_extra_packages | length > 0

- name: Create github-runner system user
  ansible.builtin.user:
    name: "{{ github_runner_service.user }}"
    group: "{{ github_runner_service.group }}"
    groups: "{{ ['docker'] + github_runner_extra_groups }}"
    append: true
    system: true
    shell: /bin/bash
    home: "{{ github_runner_paths.data_dir }}"
    create_home: false

- name: Create github-runner data directory
  ansible.builtin.file:
    path: "{{ github_runner_paths.data_dir }}"
    state: directory
    owner: "{{ github_runner_service.user }}"
    group: "{{ github_runner_service.group }}"
    mode: "0750"

- name: Check whether the runner is already extracted
  ansible.builtin.stat:
    path: "{{ github_runner_paths.data_dir }}/config.sh"
  register: _runner_extracted

- name: Download the actions-runner release archive
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ github_runner_version }}/actions-runner-linux-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz"
    dest: "{{ github_runner_paths.archive_download_dir }}/actions-runner-linux-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz"
    mode: "0644"
  when: not _runner_extracted.stat.exists

- name: Extract the actions-runner release archive
  ansible.builtin.unarchive:
    src: "{{ github_runner_paths.archive_download_dir }}/actions-runner-linux-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz"
    dest: "{{ github_runner_paths.data_dir }}"
    owner: "{{ github_runner_service.user }}"
    group: "{{ github_runner_service.group }}"
    remote_src: true
  when: not _runner_extracted.stat.exists

- name: Install runner OS dependencies
  ansible.builtin.command:
    cmd: ./bin/installdependencies.sh
    chdir: "{{ github_runner_paths.data_dir }}"
  when: not _runner_extracted.stat.exists

- name: Check whether the runner is already registered
  ansible.builtin.stat:
    path: "{{ github_runner_paths.data_dir }}/.runner"
  register: _runner_registered

- name: Ensure the registration token is configured
  ansible.builtin.assert:
    that:
      - github_runner_registration_token != "REPLACE_WITH_RUNTIME_REGISTRATION_TOKEN"
    fail_msg: >-
      github_runner_registration_token still has its placeholder value. This
      token expires after 1h and must be fetched at playbook run time (see
      docs/README.md) — it cannot be a static vaulted value.
  when: not _runner_registered.stat.exists

- name: Register the runner with GitHub
  ansible.builtin.command:
    cmd: >-
      ./config.sh
      --url https://github.com/{{ github_runner_org }}
      --token {{ github_runner_registration_token }}
      --name {{ github_runner_name }}
      --labels {{ github_runner_labels | join(',') }}
      --unattended
      {{ '--replace' if github_runner_replace_existing else '' }}
    chdir: "{{ github_runner_paths.data_dir }}"
  become: true
  become_user: "{{ github_runner_service.user }}"
  no_log: true
  when: not _runner_registered.stat.exists

- name: Compute the systemd unit name generated by svc.sh
  ansible.builtin.set_fact:
    _github_runner_service_name: "actions.runner.{{ github_runner_org }}.{{ github_runner_name }}.service"

- name: Check whether the service is already installed
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ _github_runner_service_name }}"
  register: _runner_service_installed

- name: Install the runner as a systemd service
  ansible.builtin.command:
    cmd: "./svc.sh install {{ github_runner_service.user }}"
    chdir: "{{ github_runner_paths.data_dir }}"
  when: not _runner_service_installed.stat.exists

- name: Enable and start the runner service
  ansible.builtin.systemd:
    name: "{{ _github_runner_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
